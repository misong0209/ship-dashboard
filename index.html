<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해사호 항해 대시보드</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 상단 바 -->
  <header class="topbar">
    <div>
      <span class="ship-name" id="ship-name">해사호</span>
      <span class="voyage" id="voyage">부산항 → 광양항</span>
    </div>
    <div class="clock" id="clock">--</div>
  </header>

  <main class="grid">

    <!-- 기능02: 지도와 항적 (왼쪽 2열 × 위 2행) -->
    <section class="card map-card">
      <h2>지도 · 항적</h2>
      <div class="canvas-box"><canvas id="map"></canvas></div>
      <div class="map-info">
        <span>다음 경유점(<b id="next-wp">--</b>)까지 거리: <b id="dist-next">--</b> 해리</span>
        <span>도착 예정 시각(ETA): <b id="eta">--</b></span>
      </div>
    </section>

    <!-- 기능01: 항해 정보 -->
    <section class="card">
      <h2>항해 정보</h2>
      <div class="items cols-2">
        <div class="item">
          <div class="label">위도</div>
          <div class="value"><span id="lat">--</span></div>
        </div>
        <div class="item">
          <div class="label">경도</div>
          <div class="value"><span id="lon">--</span></div>
        </div>
        <div class="item">
          <div class="label">속력 SOG</div>
          <div class="value"><span id="sog">--</span><span class="unit">노트</span></div>
        </div>
        <div class="item">
          <div class="label">침로 COG</div>
          <div class="value"><span id="cog">--</span><span class="unit">°</span></div>
        </div>
        <div class="item">
          <div class="label">선수 방위</div>
          <div class="value"><span id="heading">--</span><span class="unit">°</span></div>
        </div>
      </div>
    </section>

    <!-- 기능03: 기상·해상 -->
    <section class="card">
      <h2>기상 · 해상</h2>
      <div class="items cols-3">
        <div class="item">
          <div class="label">풍향</div>
          <div class="value"><span class="arrow" id="wind-arrow">↑</span><span id="wind-dir">--</span><span class="unit">°</span></div>
        </div>
        <div class="item" id="item-windSpeed">
          <div class="label">풍속 <span class="tag"></span></div>
          <div class="value"><span id="wind-speed">--</span><span class="unit">m/s</span></div>
        </div>
        <div class="item">
          <div class="label">파고</div>
          <div class="value"><span id="wave">--</span><span class="unit">m</span></div>
        </div>
        <div class="item" id="item-depth">
          <div class="label">수심 <span class="tag"></span></div>
          <div class="value"><span id="depth">--</span><span class="unit">m</span></div>
        </div>
        <div class="item">
          <div class="label">수온</div>
          <div class="value"><span id="water-temp">--</span><span class="unit">℃</span></div>
        </div>
        <div class="item">
          <div class="label">기압</div>
          <div class="value"><span id="pressure">--</span><span class="unit">hPa</span></div>
        </div>
      </div>
    </section>

    <!-- 기능04: 기관·연료 -->
    <section class="card">
      <h2>기관 · 연료</h2>
      <div class="items cols-2">
        <div class="item">
          <div class="label">엔진 회전수</div>
          <div class="value"><span id="rpm">--</span><span class="unit">RPM</span></div>
        </div>
        <div class="item">
          <div class="label">연료 소모량</div>
          <div class="value"><span id="fuel-rate">--</span><span class="unit">L/h</span></div>
        </div>
        <div class="item" id="item-coolantTemp">
          <div class="label">냉각수 온도 <span class="tag"></span></div>
          <div class="value"><span id="coolant">--</span><span class="unit">℃</span></div>
        </div>
        <div class="item" id="item-fuelPct">
          <div class="label">연료 잔량 <span class="tag"></span></div>
          <div class="value"><span id="fuel-pct">--</span><span class="unit">%</span></div>
          <div class="bar"><div class="bar-fill" id="fuel-bar"></div></div>
        </div>
      </div>
    </section>

    <!-- 기능05: 경보 -->
    <section class="card">
      <h2>경보</h2>
      <ul class="alarm-list" id="alarm-list"></ul>
    </section>

    <!-- 기능06: 추이 그래프 -->
    <section class="card">
      <h2>속력 · 연료 소모량 추이 (최근 60초)</h2>
      <div class="canvas-box"><canvas id="chart"></canvas></div>
    </section>

  </main>

  <!-- 순서 중요: 데이터(sim.js)를 먼저, 화면(app.js)을 나중에 불러옵니다 -->
  <script src="sim.js"></script>
  <script src="app.js"></script>
</body>
</html>
